# Offline checks only: no model requests, no credentials, no rollout collection.
name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/runtime/python-requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/runtime/*/package-lock.json

      - name: Install pinned runtimes and build the Docker workstation
        env:
          SWARMHARM_READINESS: ${{ runner.temp }}/swarmharm
        run: |
          bash scripts/setup-local
          source "$SWARMHARM_READINESS/swarmharm-local.env"
          for name in SWARMHARM_HARBOR_ENV SWARMHARM_NATIVE_CODEX SWARMHARM_DOCKER_IMAGE SWARMHARM_SANDBOX; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      - name: Check active SwarmForm matrix and offline workloads
        run: '"$SWARMHARM_HARBOR_ENV/bin/python" scripts/check_swarmform_inputs.py'

      - name: Installation check
        run: '"$SWARMHARM_HARBOR_ENV/bin/python" scripts/check-installation'

      - name: Format contract
        run: scripts/check-format-contract

      - name: Verify retained reporting registrations, settings and agent-facing wording
        run: |
          "$SWARMHARM_HARBOR_ENV/bin/python" scripts/check_dataset_admission_contract.py
          "$SWARMHARM_HARBOR_ENV/bin/python" scripts/check_balanced_study.py
          "$SWARMHARM_HARBOR_ENV/bin/python" experiments/prompt-contract/checks.py

      - name: Offline check suite
        working-directory: experiments/swarmharm-v1
        run: '"$SWARMHARM_HARBOR_ENV/bin/python" -m unittest discover -s tests -p "*_checks.py" -t . -v'
