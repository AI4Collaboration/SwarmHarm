# Offline checks only: no model requests, no credentials, no rollout collection.
name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/runtime/python-requirements.txt

      - name: Check committed documentation and registration inventory
        run: python scripts/check_dataset_admission_contract.py

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/runtime/*/package-lock.json

      - name: Install pinned runtimes and build the Docker workstation
        env:
          SWARMHARM_READINESS: ${{ runner.temp }}/swarmharm
        run: |
          bash scripts/setup-local
          source "$SWARMHARM_READINESS/swarmharm-local.env"
          for name in SWARMHARM_HARBOR_ENV SWARMHARM_NATIVE_CODEX SWARMHARM_DOCKER_IMAGE SWARMHARM_SANDBOX; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      - name: Complete offline checks (same entry point as local push)
        run: '"$SWARMHARM_HARBOR_ENV/bin/python" scripts/check-ci'
