# Offline checks only: no model requests, no credentials, no rollout collection.
name: Offline checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/runtime/python-requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/runtime/*/package-lock.json

      - name: Install pinned Harbor environment and harness adapters
        run: |
          python -m venv "$RUNNER_TEMP/harbor-0.24.0"
          "$RUNNER_TEMP/harbor-0.24.0/bin/python" -m pip install -r experiments/runtime/python-requirements.txt
          for adapter in codex claude pi; do
            npm ci --prefix "experiments/runtime/$adapter" --no-fund --no-audit
          done
          echo "SWARMHARM_HARBOR_ENV=$RUNNER_TEMP/harbor-0.24.0" >> "$GITHUB_ENV"
          echo "SWARMHARM_NATIVE_CODEX=$GITHUB_WORKSPACE/experiments/runtime/codex/node_modules/.bin/codex" >> "$GITHUB_ENV"
          echo "SWARMHARM_SANDBOX=docker" >> "$GITHUB_ENV"

      - name: Build offline workstation image
        run: |
          provenance="$RUNNER_TEMP/workstation.json"
          "$SWARMHARM_HARBOR_ENV/bin/python" scripts/build-workstation-image --platform linux/amd64 --output "$provenance"
          image=$("$SWARMHARM_HARBOR_ENV/bin/python" -c 'import json,sys;print(json.load(open(sys.argv[1]))["image"])' "$provenance")
          echo "SWARMHARM_DOCKER_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Installation check
        run: '"$SWARMHARM_HARBOR_ENV/bin/python" scripts/check-installation'

      - name: Format contract
        run: scripts/check-format-contract

      - name: Offline check suite
        working-directory: experiments/swarmharm-v1
        run: '"$SWARMHARM_HARBOR_ENV/bin/python" -m unittest discover -s tests -p "*_checks.py" -t . -v'
