# The same change-selected offline checks as local push. No model requests.
name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete offline suite
        type: boolean
        default: false

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CHECK_CI_JOBS: '4'
      CHECK_CI_DOCKER_JOBS: '1'
      CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
      CHECK_FULL: ${{ inputs.full && '--full' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Select checks from the actual changes
        id: plan
        run: |
          python scripts/check-ci --base "$CHECK_BASE" --committed $CHECK_FULL --plan > "$RUNNER_TEMP/check-plan.json"
          python - <<'PY'
          import json, os
          plan = json.load(open(os.environ['RUNNER_TEMP'] + '/check-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('dependencies', 'docker'):
                  print(f'{key}={str(plan[key]).lower()}', file=output)
              print('harnesses=' + ' '.join(plan['harnesses']), file=output)
          print(json.dumps(plan, indent=2))
          PY

      - name: Install Python dependencies when selected checks need them
        if: steps.plan.outputs.dependencies == 'true'
        run: python -m pip install -r shared/python-requirements.txt

      - uses: actions/setup-node@v5
        if: steps.plan.outputs.harnesses != ''
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shared/*/package-lock.json

      - name: Install only the selected native harnesses
        if: steps.plan.outputs.harnesses != ''
        env:
          HARNESSES: ${{ steps.plan.outputs.harnesses }}
        run: |
          for harness in $HARNESSES; do
            npm ci --prefix "shared/$harness" --no-fund --no-audit
          done
          echo "SWARMHARM_NATIVE_CODEX=$GITHUB_WORKSPACE/shared/codex/node_modules/.bin/codex" >> "$GITHUB_ENV"

      - name: Build the workstation only for Docker checks
        if: steps.plan.outputs.docker == 'true'
        run: |
          python scripts/build-workstation-image --platform linux/amd64 --output "$RUNNER_TEMP/workstation.json"
          python - <<'PY'
          import json, os
          image = json.load(open(os.environ['RUNNER_TEMP'] + '/workstation.json'))['image']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              print('SWARMHARM_DOCKER_IMAGE=' + image, file=output)
              print('SWARMHARM_SANDBOX=docker', file=output)
          PY

      - name: Run selected checks once
        run: python scripts/check-ci --base "$CHECK_BASE" --committed $CHECK_FULL
