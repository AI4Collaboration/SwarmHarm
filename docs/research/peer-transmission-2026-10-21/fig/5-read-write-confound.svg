<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 374" width="880" height="374" role="img" aria-label="Two panels: across all hf runs 22 of 75 read-crossers later wrote against 19 of 339 others, but in the 17 runs where writing happened it is 22 of 41 against 19 of 29">
<title>Two panels: across all hf runs 22 of 75 read-crossers later wrote against 19 of 339 others, but in the 17 runs where writing happened it is 22 of 41 against 19 of 29</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style>
<rect x="0.5" y="0.5" width="879" height="373" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="32" y="48" font-size="20" fill="#0b0b0b" font-weight="650">Reading forbidden data stops predicting writing once writing is possible</text>
<text x="32" y="74" font-size="13.5" fill="#52514e">Share of hf workers who went on to cross on a write, split by whether they had crossed on a read.</text>
<rect x="32" y="90.2" width="13" height="13" rx="3.5" fill="#e34948"/>
<text x="51" y="101.2" font-size="12.5" fill="#52514e">crossed on a write</text>
<rect x="192.2" y="90.2" width="13" height="13" rx="3.5" fill="#e9e8e4"/>
<text x="211.2" y="101.2" font-size="12.5" fill="#52514e">did not</text>
<rect x="32" y="125.2" width="398" height="196" rx="12" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<text x="52" y="155.2" font-size="14.5" fill="#0b0b0b" font-weight="650">All hf runs</text>
<text x="52" y="175.2" font-size="12" fill="#52514e">most of these runs had no writable protected path</text>
<text x="52" y="209.2" font-size="12.5" fill="#0b0b0b">crossed on a read</text>
<text x="410" y="209.2" font-size="12.5" fill="#52514e" text-anchor="end">22 of 75</text>
<rect x="52" y="219.2" width="358" height="18" rx="4" fill="#e9e8e4"/>
<path d="M52,219.2H153Q157,219.2 157,223.2V233.2Q157,237.2 153,237.2H52Z" fill="#e34948"/>
<text x="165" y="232.7" font-size="12.5" fill="#0b0b0b" font-weight="650">29%</text>
<text x="52" y="263.2" font-size="12.5" fill="#0b0b0b">never crossed on a read</text>
<text x="410" y="263.2" font-size="12.5" fill="#52514e" text-anchor="end">19 of 339</text>
<rect x="52" y="273.2" width="358" height="18" rx="4" fill="#e9e8e4"/>
<path d="M52,273.2H68.1Q72.1,273.2 72.1,277.2V287.2Q72.1,291.2 68.1,291.2H52Z" fill="#e34948"/>
<text x="80.1" y="286.7" font-size="12.5" fill="#0b0b0b" font-weight="650">6%</text>
<rect x="450" y="125.2" width="398" height="196" rx="12" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<text x="470" y="155.2" font-size="14.5" fill="#0b0b0b" font-weight="650">Only the 17 runs where someone wrote</text>
<text x="470" y="175.2" font-size="12" fill="#52514e">every worker here had a path to write</text>
<text x="470" y="209.2" font-size="12.5" fill="#0b0b0b">crossed on a read</text>
<text x="828" y="209.2" font-size="12.5" fill="#52514e" text-anchor="end">22 of 41</text>
<rect x="470" y="219.2" width="358" height="18" rx="4" fill="#e9e8e4"/>
<path d="M470,219.2H658.1Q662.1,219.2 662.1,223.2V233.2Q662.1,237.2 658.1,237.2H470Z" fill="#e34948"/>
<text x="670.1" y="232.7" font-size="12.5" fill="#0b0b0b" font-weight="650">54%</text>
<text x="470" y="263.2" font-size="12.5" fill="#0b0b0b">never crossed on a read</text>
<text x="828" y="263.2" font-size="12.5" fill="#52514e" text-anchor="end">19 of 29</text>
<rect x="470" y="273.2" width="358" height="18" rx="4" fill="#e9e8e4"/>
<path d="M470,273.2H700.6Q704.6,273.2 704.6,277.2V287.2Q704.6,291.2 700.6,291.2H470Z" fill="#e34948"/>
<text x="712.6" y="286.7" font-size="12.5" fill="#0b0b0b" font-weight="650">66%</text>
<text x="32" y="347.2" font-size="12.5" fill="#0b0b0b">The gap on the left comes from which runs had an open path, not from which worker looked at what.</text>
</svg>
