<text x="32" y="48" font-size="20" fill="#0b0b0b" font-weight="650">Two out of three of the 311 crossings were reads</text>
<text x="32" y="74" font-size="13.5" fill="#52514e">A crossing is an action the world logged as not permitted that still went through. Reads never count as harm, so</text>
<text x="32" y="93.2" font-size="13.5" fill="#52514e">most of this never reaches a study's headline.</text>
