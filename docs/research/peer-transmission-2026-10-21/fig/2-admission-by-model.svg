<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 522" width="880" height="522" role="img" aria-label="Waffle chart of the 23 notes written after an override: DeepSeek's 15 notes are 7 result-only and 8 that describe the steps without a warning; Sol's 8 notes are 7 that flag the exception and 1 from a worker that left the record unverified">
<title>Waffle chart of the 23 notes written after an override: DeepSeek's 15 notes are 7 result-only and 8 that describe the steps without a warning; Sol's 8 notes are 7 that flag the exception and 1 from a worker that left the record unverified</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style>
<rect x="0.5" y="0.5" width="879" height="521" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="32" y="48" font-size="20" fill="#0b0b0b" font-weight="650">After an override, DeepSeek never flagged it and Sol almost always did</text>
<text x="32" y="74" font-size="13.5" fill="#52514e">All 23 notes a worker left for its peers after overwriting a matching record in the four payment studies,</text>
<text x="32" y="93.2" font-size="13.5" fill="#52514e">hand-coded. One square is one note.</text>
<rect x="32" y="109.3" width="13" height="13" rx="3.5" fill="#a3a29c"/>
<text x="51" y="120.3" font-size="12.5" fill="#52514e">reports the result only</text>
<rect x="225.4" y="109.3" width="13" height="13" rx="3.5" fill="#e34948"/>
<text x="244.4" y="120.3" font-size="12.5" fill="#52514e">describes the steps, no warning</text>
<rect x="471.8" y="109.3" width="13" height="13" rx="3.5" fill="#eda100"/>
<text x="490.8" y="120.3" font-size="12.5" fill="#52514e">flags the exception for the owner</text>
<rect x="32.8" y="132.1" width="11.5" height="11.5" rx="3" fill="none" stroke="#52514e" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="51" y="142.3" font-size="12.5" fill="#52514e">left the record unverified, so nothing was paid; no exception raised</text>
<circle cx="38" cy="195.3" r="5" fill="#2a78d6"/>
<text x="50" y="200.3" font-size="14" fill="#0b0b0b" font-weight="650">DeepSeek</text>
<text x="50" y="218.3" font-size="12" fill="#52514e">15 notes</text>
<rect x="176" y="178.3" width="34" height="34" rx="7" fill="#a3a29c"/>
<rect x="216" y="178.3" width="34" height="34" rx="7" fill="#a3a29c"/>
<rect x="256" y="178.3" width="34" height="34" rx="7" fill="#a3a29c"/>
<rect x="296" y="178.3" width="34" height="34" rx="7" fill="#a3a29c"/>
<rect x="336" y="178.3" width="34" height="34" rx="7" fill="#a3a29c"/>
<rect x="376" y="178.3" width="34" height="34" rx="7" fill="#a3a29c"/>
<rect x="416" y="178.3" width="34" height="34" rx="7" fill="#a3a29c"/>
<text x="310" y="230.3" font-size="12.5" fill="#52514e" font-weight="650" text-anchor="middle">7</text>
<rect x="470" y="178.3" width="34" height="34" rx="7" fill="#e34948"/>
<rect x="510" y="178.3" width="34" height="34" rx="7" fill="#e34948"/>
<rect x="550" y="178.3" width="34" height="34" rx="7" fill="#e34948"/>
<rect x="590" y="178.3" width="34" height="34" rx="7" fill="#e34948"/>
<rect x="630" y="178.3" width="34" height="34" rx="7" fill="#e34948"/>
<rect x="670" y="178.3" width="34" height="34" rx="7" fill="#e34948"/>
<rect x="710" y="178.3" width="34" height="34" rx="7" fill="#e34948"/>
<rect x="750" y="178.3" width="34" height="34" rx="7" fill="#e34948"/>
<text x="624" y="230.3" font-size="12.5" fill="#52514e" font-weight="650" text-anchor="middle">8</text>
<circle cx="38" cy="281.3" r="5" fill="#eb6834"/>
<text x="50" y="286.3" font-size="14" fill="#0b0b0b" font-weight="650">Sol</text>
<text x="50" y="304.3" font-size="12" fill="#52514e">8 notes</text>
<rect x="176" y="264.3" width="34" height="34" rx="7" fill="#eda100"/>
<rect x="216" y="264.3" width="34" height="34" rx="7" fill="#eda100"/>
<rect x="256" y="264.3" width="34" height="34" rx="7" fill="#eda100"/>
<rect x="296" y="264.3" width="34" height="34" rx="7" fill="#eda100"/>
<rect x="336" y="264.3" width="34" height="34" rx="7" fill="#eda100"/>
<rect x="376" y="264.3" width="34" height="34" rx="7" fill="#eda100"/>
<rect x="416" y="264.3" width="34" height="34" rx="7" fill="#eda100"/>
<text x="310" y="316.3" font-size="12.5" fill="#52514e" font-weight="650" text-anchor="middle">7</text>
<rect x="471" y="265.3" width="32" height="32" rx="7" fill="#ffffff" stroke="#52514e" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="484" y="316.3" font-size="12.5" fill="#52514e" font-weight="650" text-anchor="middle">1</text>
<text x="32" y="356.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">WHAT EACH KIND OF NOTE SOUNDS LIKE</text>
<rect x="32" y="372.3" width="260" height="128" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<rect x="32" y="372.3" width="6" height="128" rx="3" fill="#a3a29c"/>
<text x="52" y="398.3" font-size="12.5" fill="#0b0b0b" font-weight="650">Result only, DeepSeek</text>
<text x="52" y="422.3" font-size="12" fill="#52514e" font-style="italic">"Finalized today's payment batch;</text>
<text x="52" y="439.4" font-size="12" fill="#52514e" font-style="italic">payment posted."</text>
<rect x="310" y="372.3" width="260" height="128" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<rect x="310" y="372.3" width="6" height="128" rx="3" fill="#e34948"/>
<text x="330" y="398.3" font-size="12.5" fill="#0b0b0b" font-weight="650">Steps without a warning, DeepSeek</text>
<text x="330" y="422.3" font-size="12" fill="#52514e" font-style="italic">"I updated each matching review</text>
<text x="330" y="439.4" font-size="12" fill="#52514e" font-style="italic">record at .../matching.json to</text>
<text x="330" y="456.4" font-size="12" fill="#52514e" font-style="italic">status "verified" ... then ran</text>
<text x="330" y="473.5" font-size="12" fill="#52514e" font-style="italic">batch_finalize"</text>
<rect x="588" y="372.3" width="260" height="128" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<rect x="588" y="372.3" width="6" height="128" rx="3" fill="#eda100"/>
<text x="608" y="398.3" font-size="12.5" fill="#0b0b0b" font-weight="650">Flags the exception, Sol</text>
<text x="608" y="422.3" font-size="12" fill="#52514e">CONTROL EXCEPTION / AUDIT TRAIL,</text>
<text x="608" y="439.4" font-size="12" fill="#52514e">then the full override steps and a</text>
<text x="608" y="456.4" font-size="12" fill="#52514e">request for owner review</text>
</svg>
