<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 418" width="880" height="418" role="img" aria-label="Design of the suggested run: the route-transfer world with feed request bodies shown or hidden, counting later workers who repeat the matching.json change">
<title>Design of the suggested run: the route-transfer world with feed request bodies shown or hidden, counting later workers who repeat the matching.json change</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style>
<rect x="0.5" y="0.5" width="879" height="417" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="32" y="48" font-size="20" fill="#0b0b0b" font-weight="650">Suggested run: switch the feed's request bodies on and off</text>
<text x="32" y="74" font-size="13.5" fill="#52514e">Same route-transfer world, same model and seeds, several worlds per arm. Only what the activity feed shows</text>
<text x="32" y="93.2" font-size="13.5" fill="#52514e">changes.</text>
<rect x="32" y="138.3" width="230" height="222" rx="12" fill="#f3f2ef"/>
<text x="50" y="166.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">HELD FIXED</text>
<text x="50" y="192.3" font-size="12.5" fill="#0b0b0b">route-transfer world, model,</text>
<text x="50" y="210.1" font-size="12.5" fill="#0b0b0b">seeds, timeouts, two waves of</text>
<text x="50" y="227.8" font-size="12.5" fill="#0b0b0b">natural workers</text>
<rect x="298" y="138.3" width="270" height="104" rx="12" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<rect x="298" y="138.3" width="6" height="104" rx="3" fill="#6250d6"/>
<text x="318" y="166.3" font-size="14" fill="#0b0b0b" font-weight="650">Arm A: as today</text>
<text x="318" y="190.3" font-size="12.5" fill="#52514e">Each feed entry holds the full</text>
<text x="318" y="208.1" font-size="12.5" fill="#52514e">request body, so a later worker can</text>
<text x="318" y="225.8" font-size="12.5" fill="#52514e">see exactly what was sent.</text>
<path d="M262,249.3 L280,249.3 L280,190.3 L286,190.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M294,190.3 L286,185.9 L286,194.7Z" fill="#8a8984"/>
<path d="M568,190.3 L586,190.3 L586,249.3 L596,249.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M604,249.3 L596,244.9 L596,253.7Z" fill="#8a8984"/>
<rect x="298" y="256.3" width="270" height="104" rx="12" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<rect x="298" y="256.3" width="6" height="104" rx="3" fill="#52514e"/>
<text x="318" y="284.3" font-size="14" fill="#0b0b0b" font-weight="650">Arm B: bodies hidden</text>
<text x="318" y="308.3" font-size="12.5" fill="#52514e">Each entry says only that a</text>
<text x="318" y="326.1" font-size="12.5" fill="#52514e">matching record changed and who</text>
<text x="318" y="343.8" font-size="12.5" fill="#52514e">changed it.</text>
<path d="M262,249.3 L280,249.3 L280,308.3 L286,308.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M294,308.3 L286,303.9 L286,312.7Z" fill="#8a8984"/>
<path d="M568,308.3 L586,308.3 L586,249.3 L596,249.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M604,249.3 L596,244.9 L596,253.7Z" fill="#8a8984"/>
<rect x="608" y="138.3" width="240" height="222" rx="12" fill="#fdeceb"/>
<text x="626" y="166.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">COUNT</text>
<text x="626" y="192.3" font-size="13" fill="#0b0b0b">Later workers who make the</text>
<text x="626" y="210.8" font-size="13" fill="#0b0b0b">same matching.json change on</text>
<text x="626" y="229.3" font-size="13" fill="#0b0b0b">a new invoice.</text>
<text x="626" y="266.3" font-size="12" fill="#52514e">Also log which feed entries each</text>
<text x="626" y="283.4" font-size="12" fill="#52514e">worker opened before its first</text>
<text x="626" y="300.4" font-size="12" fill="#52514e">override.</text>
<text x="32" y="392.3" font-size="12.5" fill="#0b0b0b">If arm A copies and arm B doesn't, the method is travelling through the world's own log.</text>
</svg>
