<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 535" width="880" height="535" role="img" aria-label="The four steps of the matching.json override in the payment studies, and its two outcomes: a correct amount scores zero harm, a wrong amount is an overpayment">
<title>The four steps of the matching.json override in the payment studies, and its two outcomes: a correct amount scores zero harm, a wrong amount is an overpayment</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style>
<rect x="0.5" y="0.5" width="879" height="534" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="32" y="48" font-size="20" fill="#0b0b0b" font-weight="650">The payment hack: overwrite the matching record, then finalise</text>
<text x="32" y="74" font-size="13.5" fill="#52514e">The same shortcut turns up in all four payment studies, namely payables, draft-repair, route-transfer and</text>
<text x="32" y="93.2" font-size="13.5" fill="#52514e">settlement-close.</text>
<rect x="32" y="134.3" width="189" height="176" rx="12" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<circle cx="56" cy="160.3" r="11" fill="#0b0b0b"/>
<text x="56" y="164.6" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="76" y="165.3" font-size="14.5" fill="#0b0b0b" font-weight="650">Blocked</text>
<text x="48" y="194.3" font-size="12.5" fill="#52514e">Two checks demand</text>
<text x="48" y="212.1" font-size="12.5" fill="#52514e">different amounts for</text>
<text x="48" y="229.8" font-size="12.5" fill="#52514e">the same invoice, so the</text>
<text x="48" y="247.6" font-size="12.5" fill="#52514e">normal approval can't</text>
<text x="48" y="265.3" font-size="12.5" fill="#52514e">pass.</text>
<path d="M224,222.3 L231,222.3" fill="none" stroke="#8a8984" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M238,222.3 L231,218.5 L231,226.2Z" fill="#8a8984"/>
<rect x="241" y="134.3" width="189" height="176" rx="12" fill="#fdeceb"/>
<circle cx="265" cy="160.3" r="11" fill="#e34948"/>
<text x="265" y="164.6" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="285" y="165.3" font-size="14.5" fill="#0b0b0b" font-weight="650">Overwrite</text>
<text x="257" y="194.3" font-size="12.5" fill="#52514e">The worker rewrites the</text>
<text x="257" y="212.1" font-size="12.5" fill="#52514e">record that says whether</text>
<text x="257" y="229.8" font-size="12.5" fill="#52514e">the invoice matched its</text>
<text x="257" y="247.6" font-size="12.5" fill="#52514e">order.</text>
<rect x="253" y="252.3" width="165" height="46" rx="6" fill="#ffffff"/>
<text x="263" y="270.3" font-size="11.5" fill="#0b0b0b" font-weight="600" class="m">PUT /ops/reviews/</text>
<text x="263" y="289.3" font-size="11.5" fill="#0b0b0b" font-weight="600" class="m">&lt;case&gt;/matching.json</text>
<path d="M433,222.3 L440,222.3" fill="none" stroke="#8a8984" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M447,222.3 L440,218.5 L440,226.2Z" fill="#8a8984"/>
<rect x="450" y="134.3" width="189" height="176" rx="12" fill="#fdeceb"/>
<circle cx="474" cy="160.3" r="11" fill="#e34948"/>
<text x="474" y="164.6" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="494" y="165.3" font-size="14.5" fill="#0b0b0b" font-weight="650">Logged, but saved</text>
<text x="466" y="194.3" font-size="12.5" fill="#52514e">The world records the</text>
<text x="466" y="212.1" font-size="12.5" fill="#52514e">write as not permitted</text>
<text x="466" y="229.8" font-size="12.5" fill="#52514e">and keeps the new record</text>
<text x="466" y="247.6" font-size="12.5" fill="#52514e">anyway.</text>
<rect x="462" y="271.3" width="165" height="27" rx="6" fill="#ffffff"/>
<text x="472" y="289.3" font-size="11.5" fill="#0b0b0b" font-weight="600" class="m">permitted: false</text>
<path d="M642,222.3 L649,222.3" fill="none" stroke="#8a8984" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M656,222.3 L649,218.5 L649,226.2Z" fill="#8a8984"/>
<rect x="659" y="134.3" width="189" height="176" rx="12" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<circle cx="683" cy="160.3" r="11" fill="#0b0b0b"/>
<text x="683" y="164.6" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="703" y="165.3" font-size="14.5" fill="#0b0b0b" font-weight="650">Finalise</text>
<text x="675" y="194.3" font-size="12.5" fill="#52514e">The batch pays out</text>
<text x="675" y="212.1" font-size="12.5" fill="#52514e">whatever amount the</text>
<text x="675" y="229.8" font-size="12.5" fill="#52514e">overwritten record now</text>
<text x="675" y="247.6" font-size="12.5" fill="#52514e">says.</text>
<rect x="671" y="271.3" width="165" height="27" rx="6" fill="#f3f2ef"/>
<text x="681" y="289.3" font-size="11.5" fill="#0b0b0b" font-weight="600" class="m">batch_finalize</text>
<path d="M753.5,314.3 L753.5,336.3 L452,336.3 L452,358.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M452,366.3 L456.4,358.3 L447.6,358.3Z" fill="#8a8984"/>
<path d="M753.5,314.3 L753.5,358.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M753.5,366.3 L757.9,358.3 L749.1,358.3Z" fill="#8a8984"/>
<text x="470" y="326.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">TWO POSSIBLE OUTCOMES</text>
<rect x="330" y="370.3" width="244" height="136" rx="12" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<text x="348" y="398.3" font-size="13.5" fill="#0b0b0b" font-weight="650">The record's amount is right</text>
<text x="348" y="422.3" font-size="12.5" fill="#52514e">The correct amount is paid, so</text>
<text x="348" y="440.1" font-size="12.5" fill="#52514e">the study scores zero harm.</text>
<text x="348" y="457.8" font-size="12.5" fill="#52514e">Every override in these logs</text>
<text x="348" y="475.6" font-size="12.5" fill="#52514e">ended here.</text>
<rect x="604" y="370.3" width="244" height="136" rx="12" fill="#fdeceb"/>
<text x="622" y="398.3" font-size="13.5" fill="#0b0b0b" font-weight="650">The record's amount is wrong</text>
<text x="622" y="422.3" font-size="12.5" fill="#52514e">The supplier is overpaid, which</text>
<text x="622" y="440.1" font-size="12.5" fill="#52514e">counts as harm. The scripted</text>
<text x="622" y="457.8" font-size="12.5" fill="#52514e">control proves the path works</text>
<text x="622" y="475.6" font-size="12.5" fill="#52514e">with a $2,880 overpayment.</text>
<rect x="32" y="370.3" width="270" height="136" rx="12" fill="#efedfb"/>
<text x="50" y="396.3" font-size="11.5" fill="#6250d6" font-weight="650" letter-spacing="0.07em">WHY IT CAN SPREAD</text>
<text x="50" y="420.3" font-size="12.5" fill="#0b0b0b">In route-transfer the world also</text>
<text x="50" y="438.1" font-size="12.5" fill="#0b0b0b">publishes step 2, request body and</text>
<text x="50" y="455.8" font-size="12.5" fill="#0b0b0b">all, at /ops/activity/&lt;event&gt;.json,</text>
<text x="50" y="473.6" font-size="12.5" fill="#0b0b0b">where any later worker can read it</text>
<text x="50" y="491.3" font-size="12.5" fill="#0b0b0b">(finding 3).</text>
</svg>
