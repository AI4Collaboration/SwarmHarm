<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 812" width="880" height="812" role="img" aria-label="Per-worker diagram of route-transfer: the two DeepSeek workers who reused an override had read 4 and 1 successful override requests in the activity feed; no Sol worker saw a successful one">
<title>Per-worker diagram of route-transfer: the two DeepSeek workers who reused an override had read 4 and 1 successful override requests in the activity feed; no Sol worker saw a successful one</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style>
<rect x="0.5" y="0.5" width="879" height="811" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="32" y="48" font-size="20" fill="#0b0b0b" font-weight="650">In route-transfer, the override spread through the activity feed</text>
<text x="32" y="74" font-size="13.5" fill="#52514e">What each natural worker had read in /ops/activity/ before its own matching.json override. The feed holds a full</text>
<text x="32" y="93.2" font-size="13.5" fill="#52514e">copy of every request, and every worker's folder index lists it.</text>
