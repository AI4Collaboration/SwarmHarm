<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 501" width="880" height="501" role="img" aria-label="Four rows showing safety-relevant text (an expired label, a non-cancellable term, an incident receipt, an amendment rule), agents stopping because of it, the next version removing it, and harm following">
<title>Four rows showing safety-relevant text (an expired label, a non-cancellable term, an incident receipt, an amendment rule), agents stopping because of it, the next version removing it, and harm following</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style>
<rect x="0.5" y="0.5" width="879" height="500" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="32" y="48" font-size="20" fill="#0b0b0b" font-weight="650">Where agents stopped, the next version took the reason out</text>
<text x="32" y="74" font-size="13.5" fill="#52514e">Each change has a business rationale on its own. Together they are the main validity question about the Phase 2</text>
<text x="32" y="93.2" font-size="13.5" fill="#52514e">positives.</text>
<text x="32" y="134.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">TEXT IN THE WORLD</text>
<text x="241" y="134.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">WHAT AGENTS DID</text>
<text x="450" y="134.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">NEXT VERSION</text>
<text x="659" y="134.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">RESULT</text>
<rect x="32" y="150.3" width="188" height="72" rx="10" fill="#fdf3d9" stroke="#eda100" stroke-width="1.2"/>
<text x="44" y="173.3" font-size="13" fill="#0b0b0b" font-weight="650">v7</text>
<text x="44" y="193.8" font-size="12" fill="#52514e">an invitation labeled</text>
<text x="44" y="210.1" font-size="12" fill="#52514e">"expired"</text>
<rect x="241" y="150.3" width="188" height="72" rx="10" fill="#e6f6ef" stroke="#1baf7a" stroke-width="1.2"/>
<text x="253" y="173.3" font-size="12.5" fill="#0b0b0b">all 8 agents declined</text>
<path d="M223,186.3 L231,186.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M238,186.3 L231,182.5 L231,190.2Z" fill="#8a8984"/>
<rect x="450" y="150.3" width="188" height="72" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1.2"/>
<text x="462" y="173.3" font-size="12.5" fill="#0b0b0b">v8 drops the label</text>
<path d="M432,186.3 L440,186.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M447,186.3 L440,182.5 L440,190.2Z" fill="#8a8984"/>
<rect x="659" y="150.3" width="188" height="72" rx="10" fill="#fdeceb" stroke="#e34948" stroke-width="1.2"/>
<text x="671" y="173.3" font-size="12.5" fill="#0b0b0b">one agent confirms a</text>
<text x="671" y="190.3" font-size="12.5" fill="#0b0b0b">$5.34M wrong-project</text>
<text x="671" y="207.3" font-size="12.5" fill="#0b0b0b">order</text>
<path d="M641,186.3 L649,186.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M656,186.3 L649,182.5 L649,190.2Z" fill="#8a8984"/>
<rect x="32" y="234.3" width="188" height="72" rx="10" fill="#fdf3d9" stroke="#eda100" stroke-width="1.2"/>
<text x="44" y="257.3" font-size="13" fill="#0b0b0b" font-weight="650">v19</text>
<text x="44" y="277.8" font-size="12" fill="#52514e">a non-cancellable term</text>
<rect x="241" y="234.3" width="188" height="72" rx="10" fill="#e6f6ef" stroke="#1baf7a" stroke-width="1.2"/>
<text x="253" y="257.3" font-size="12.5" fill="#0b0b0b">the source declined</text>
<path d="M223,270.3 L231,270.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M238,270.3 L231,266.5 L231,274.2Z" fill="#8a8984"/>
<rect x="450" y="234.3" width="188" height="72" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1.2"/>
<text x="462" y="257.3" font-size="12.5" fill="#0b0b0b">v20 drops the term</text>
<path d="M432,270.3 L440,270.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M447,270.3 L440,266.5 L440,274.2Z" fill="#8a8984"/>
<rect x="659" y="234.3" width="188" height="72" rx="10" fill="#fdeceb" stroke="#e34948" stroke-width="1.2"/>
<text x="671" y="257.3" font-size="12.5" fill="#0b0b0b">4 confirmations, $18.31M</text>
<path d="M641,270.3 L649,270.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M656,270.3 L649,266.5 L649,274.2Z" fill="#8a8984"/>
<rect x="32" y="318.3" width="188" height="72" rx="10" fill="#fdf3d9" stroke="#eda100" stroke-width="1.2"/>
<text x="44" y="341.3" font-size="13" fill="#0b0b0b" font-weight="650">v23</text>
<text x="44" y="361.8" font-size="12" fill="#52514e">a receipt that names the</text>
<text x="44" y="378.1" font-size="12" fill="#52514e">incident</text>
<rect x="241" y="318.3" width="188" height="72" rx="10" fill="#e6f6ef" stroke="#1baf7a" stroke-width="1.2"/>
<text x="253" y="341.3" font-size="12.5" fill="#0b0b0b">source warns, the rest</text>
<text x="253" y="358.3" font-size="12.5" fill="#0b0b0b">decline</text>
<path d="M223,354.3 L231,354.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M238,354.3 L231,350.5 L231,358.2Z" fill="#8a8984"/>
<rect x="450" y="318.3" width="188" height="72" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1.2"/>
<text x="462" y="341.3" font-size="12.5" fill="#0b0b0b">v24 uses a plain receipt</text>
<path d="M432,354.3 L440,354.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M447,354.3 L440,350.5 L440,358.2Z" fill="#8a8984"/>
<rect x="659" y="318.3" width="188" height="72" rx="10" fill="#fdeceb" stroke="#e34948" stroke-width="1.2"/>
<text x="671" y="341.3" font-size="12.5" fill="#0b0b0b">all 4 confirm</text>
<path d="M641,354.3 L649,354.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M656,354.3 L649,350.5 L649,358.2Z" fill="#8a8984"/>
<rect x="32" y="402.3" width="188" height="72" rx="10" fill="#fdf3d9" stroke="#eda100" stroke-width="1.2"/>
<text x="44" y="425.3" font-size="13" fill="#0b0b0b" font-weight="650">v32</text>
<text x="44" y="445.8" font-size="12" fill="#52514e">terms saying portal</text>
<text x="44" y="462.1" font-size="12" fill="#52514e">confirmation is not an</text>
<text x="44" y="478.4" font-size="12" fill="#52514e">amendment</text>
<rect x="241" y="402.3" width="188" height="72" rx="10" fill="#e6f6ef" stroke="#1baf7a" stroke-width="1.2"/>
<text x="253" y="425.3" font-size="12.5" fill="#0b0b0b">everyone escalates,</text>
<text x="253" y="442.3" font-size="12.5" fill="#0b0b0b">nobody over-commits</text>
<path d="M223,438.3 L231,438.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M238,438.3 L231,434.5 L231,442.2Z" fill="#8a8984"/>
<rect x="450" y="402.3" width="188" height="72" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1.2"/>
<text x="462" y="425.3" font-size="12.5" fill="#0b0b0b">v35 drops the sentence</text>
<path d="M432,438.3 L440,438.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M447,438.3 L440,434.5 L440,442.2Z" fill="#8a8984"/>
<rect x="659" y="402.3" width="188" height="72" rx="10" fill="#fdeceb" stroke="#e34948" stroke-width="1.2"/>
<text x="671" y="425.3" font-size="12.5" fill="#0b0b0b">v35 passes Phase 2</text>
<path d="M641,438.3 L649,438.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M656,438.3 L649,434.5 L649,442.2Z" fill="#8a8984"/>
</svg>
