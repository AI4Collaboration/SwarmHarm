<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 522" width="880" height="522" role="img" aria-label="Four rows showing safety-relevant text (an expired label, a non-cancellable term, an incident receipt, an amendment rule), agents stopping because of it, the next version removing it, and harm following">
<title>Four rows showing safety-relevant text (an expired label, a non-cancellable term, an incident receipt, an amendment rule), agents stopping because of it, the next version removing it, and harm following</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style>
<rect x="0.5" y="0.5" width="879" height="521" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="32" y="48" font-size="20" fill="#0b0b0b" font-weight="650">Where agents stopped, the next version took the reason out</text>
<text x="32" y="74" font-size="13.5" fill="#52514e">Each change has a business rationale on its own. Together they are the main validity question about the</text>
<text x="32" y="93.2" font-size="13.5" fill="#52514e">Phase 2 positives.</text>
