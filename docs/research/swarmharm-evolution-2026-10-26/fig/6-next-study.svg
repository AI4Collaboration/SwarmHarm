<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Design of the suggested rate study: cue, safety sentence, model and actor window as factors, run across four domains with N rollouts per cell, giving a rate per cell">
<title>Design of the suggested rate study: cue, safety sentence, model and actor window as factors, run across four domains with N rollouts per cell, giving a rate per cell</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style>
<rect x="0.5" y="0.5" width="879" height="429" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="32" y="48" font-size="20" fill="#0b0b0b" font-weight="650">What I'd run next: one registered rate study</text>
<text x="32" y="74" font-size="13.5" fill="#52514e">Terry's own takeaways already say to stop tuning and run this. These are the factors I'd put in it.</text>
<rect x="32" y="115.2" width="236" height="62" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1.2"/>
<text x="44" y="138.2" font-size="13" fill="#0b0b0b" font-weight="650">Cue</text>
<text x="44" y="158.6" font-size="12" fill="#52514e">cue-7 against cue-5 or cue-6</text>
<path d="M272,146.2 L300,146.2 L300,257.2 L319,257.2" fill="none" stroke="#8a8984" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M326,257.2 L319,253.3 L319,261Z" fill="#8a8984"/>
<rect x="32" y="189.2" width="236" height="62" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1.2"/>
<text x="44" y="212.2" font-size="13" fill="#0b0b0b" font-weight="650">Safety sentence</text>
<text x="44" y="232.6" font-size="12" fill="#52514e">put back in half the rollouts</text>
<path d="M272,220.2 L300,220.2 L300,257.2 L319,257.2" fill="none" stroke="#8a8984" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M326,257.2 L319,253.3 L319,261Z" fill="#8a8984"/>
<rect x="32" y="263.2" width="236" height="62" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1.2"/>
<text x="44" y="286.2" font-size="13" fill="#0b0b0b" font-weight="650">Model</text>
<text x="44" y="306.6" font-size="12" fill="#52514e">GLM, Sol and DeepSeek</text>
<path d="M272,294.2 L300,294.2 L300,257.2 L319,257.2" fill="none" stroke="#8a8984" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M326,257.2 L319,253.3 L319,261Z" fill="#8a8984"/>
<rect x="32" y="337.2" width="236" height="62" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1.2"/>
<text x="44" y="360.2" font-size="13" fill="#0b0b0b" font-weight="650">Actor window</text>
<text x="44" y="380.6" font-size="12" fill="#52514e">registered, not a fixed 300 s</text>
<path d="M272,368.2 L300,368.2 L300,257.2 L319,257.2" fill="none" stroke="#8a8984" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M326,257.2 L319,253.3 L319,261Z" fill="#8a8984"/>
<rect x="330" y="207.2" width="236" height="100" rx="10" fill="#f3f2ef"/>
<text x="342" y="230.2" font-size="13" fill="#0b0b0b" font-weight="650">Four finished domains</text>
<text x="342" y="250.6" font-size="12" fill="#52514e">N independent rollouts per</text>
<text x="342" y="267" font-size="12" fill="#52514e">cell, registered before any</text>
<text x="342" y="283.3" font-size="12" fill="#52514e">run</text>
<path d="M570,257.2 L599,257.2" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
