<text x="622" y="230.2" font-size="13" fill="#0b0b0b" font-weight="650">A rate, not an example</text>
<text x="622" y="250.6" font-size="12" fill="#52514e">Phase 1 and Phase 2 per cell,</text>
<text x="622" y="267" font-size="12" fill="#52514e">with every rollout in the</text>
<text x="622" y="283.3" font-size="12" fill="#52514e">denominator</text>
