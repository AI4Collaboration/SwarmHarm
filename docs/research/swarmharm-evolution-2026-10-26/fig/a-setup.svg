<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 589" width="880" height="589" role="img" aria-label="Diagram of a SwarmHarm campaign: four agents with their own stuck jobs read and write a shared activity surface whose cue has rungs 1 to 7, act on a business system, and an independent verifier holding protected truth scores Phase 1 and Phase 2">
<title>Diagram of a SwarmHarm campaign: four agents with their own stuck jobs read and write a shared activity surface whose cue has rungs 1 to 7, act on a business system, and an independent verifier holding protected truth scores Phase 1 and Phase 2</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style>
<rect x="0.5" y="0.5" width="879" height="588" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="32" y="48" font-size="20" fill="#0b0b0b" font-weight="650">One campaign: four agents, one shared surface, one verifier</text>
<text x="32" y="74" font-size="13.5" fill="#52514e">Each agent has its own job and gets stuck on something only another job can unblock. Nobody tells them the others</text>
<text x="32" y="93.2" font-size="13.5" fill="#52514e">exist.</text>
<circle cx="43" cy="134.3" r="11" fill="#0b0b0b"/>
<text x="43" y="138.6" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="62" y="138.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">FOUR AGENTS</text>
<rect x="32" y="156.3" width="236" height="62" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<circle cx="56" cy="179.3" r="5.5" fill="#52514e"/>
<path d="M46.5,197.3 A9.5,9.5 0 0 1 65.5,197.3Z" fill="#52514e"/>
<text x="78" y="183.3" font-size="13.5" fill="#0b0b0b" font-weight="650">Alder</text>
<text x="78" y="202.3" font-size="12" fill="#52514e">supplier review</text>
<rect x="212.2" y="168.6" width="43.8" height="19.5" rx="9.8" fill="#e34948"/>
<text x="234.1" y="182.1" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle">stuck</text>
<rect x="32" y="228.3" width="236" height="62" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<circle cx="56" cy="251.3" r="5.5" fill="#52514e"/>
<path d="M46.5,269.3 A9.5,9.5 0 0 1 65.5,269.3Z" fill="#52514e"/>
<text x="78" y="255.3" font-size="13.5" fill="#0b0b0b" font-weight="650">Birch</text>
<text x="78" y="274.3" font-size="12" fill="#52514e">capacity request</text>
<rect x="212.2" y="240.6" width="43.8" height="19.5" rx="9.8" fill="#e34948"/>
<text x="234.1" y="254.1" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle">stuck</text>
<rect x="32" y="300.3" width="236" height="62" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<circle cx="56" cy="323.3" r="5.5" fill="#52514e"/>
<path d="M46.5,341.3 A9.5,9.5 0 0 1 65.5,341.3Z" fill="#52514e"/>
<text x="78" y="327.3" font-size="13.5" fill="#0b0b0b" font-weight="650">Cedar</text>
<text x="78" y="346.3" font-size="12" fill="#52514e">cohort report</text>
<rect x="212.2" y="312.6" width="43.8" height="19.5" rx="9.8" fill="#e34948"/>
<text x="234.1" y="326.1" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle">stuck</text>
<rect x="32" y="372.3" width="236" height="62" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<circle cx="56" cy="395.3" r="5.5" fill="#52514e"/>
<path d="M46.5,413.3 A9.5,9.5 0 0 1 65.5,413.3Z" fill="#52514e"/>
<text x="78" y="399.3" font-size="13.5" fill="#0b0b0b" font-weight="650">Elm</text>
<text x="78" y="418.3" font-size="12" fill="#52514e">regional publication</text>
<rect x="212.2" y="384.6" width="43.8" height="19.5" rx="9.8" fill="#e34948"/>
<text x="234.1" y="398.1" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle">stuck</text>
<circle cx="331" cy="134.3" r="11" fill="#0b0b0b"/>
<text x="331" y="138.6" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="350" y="138.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">WHAT THEY SHARE</text>
<rect x="320" y="156.3" width="272" height="190" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<text x="334" y="180.3" font-size="13.5" fill="#0b0b0b" font-weight="650">Activity surface</text>
<rect x="334" y="198.3" width="244" height="17" rx="4" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1"/>
<text x="342" y="210.8" font-size="11" fill="#52514e" class="m">Birch  need: a capacity route</text>
<rect x="334" y="220.3" width="244" height="17" rx="4" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1"/>
<text x="342" y="232.8" font-size="11" fill="#52514e" class="m">Alder  route for SUP-08</text>
<rect x="334" y="242.3" width="244" height="17" rx="4" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1"/>
<text x="342" y="254.8" font-size="11" fill="#52514e" class="m">Cedar  read Alder's post</text>
<rect x="334" y="270.3" width="138.4" height="20" rx="10" fill="#0b0b0b"/>
<text x="403.2" y="284.3" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">the cue: rungs 1 to 7</text>
<text x="334" y="310.3" font-size="11.5" fill="#52514e">how directly it points a stuck case at</text>
<text x="334" y="326.7" font-size="11.5" fill="#52514e">someone who can help</text>
<rect x="320" y="364.3" width="272" height="92" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<text x="334" y="389.3" font-size="13.5" fill="#0b0b0b" font-weight="650">Business system</text>
<text x="334" y="411.3" font-size="12" fill="#52514e">quotes, confirmations, reservations,</text>
<text x="334" y="428.4" font-size="12" fill="#52514e">filings: ordinary tools with real side</text>
<text x="334" y="445.4" font-size="12" fill="#52514e">effects</text>
<circle cx="657" cy="134.3" r="11" fill="#0b0b0b"/>
<text x="657" y="138.6" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="676" y="138.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">WHO SCORES IT</text>
<rect x="646" y="156.3" width="202" height="300" rx="10" fill="#f3f2ef"/>
<text x="660" y="181.3" font-size="13.5" fill="#0b0b0b" font-weight="650">Independent verifier</text>
<path d="M660,198.3 H675.4 L682,204.9 V226.3 H660Z" fill="#fdf3d9" stroke="#52514e" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M675.4,198.3 V204.9 H682" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M663.5,207.9 H678.5" stroke="#52514e" stroke-width="1.3" stroke-linecap="round"/>
<path d="M663.5,213.1 H678.5" stroke="#52514e" stroke-width="1.3" stroke-linecap="round"/>
<path d="M663.5,218.2 H674.5" stroke="#52514e" stroke-width="1.3" stroke-linecap="round"/>
<text x="692" y="211.3" font-size="12.5" fill="#0b0b0b" font-weight="600">Protected truth</text>
<text x="692" y="227.3" font-size="11.5" fill="#52514e">agents never see it</text>
<text x="660" y="260.3" font-size="12" fill="#0b0b0b">Recomputes the system-level</text>
<text x="660" y="277.4" font-size="12" fill="#0b0b0b">effect from the trace and</text>
<text x="660" y="294.4" font-size="12" fill="#0b0b0b">the truth, summed across</text>
<text x="660" y="311.5" font-size="12" fill="#0b0b0b">agents.</text>
<rect x="660" y="382.3" width="132.6" height="20" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1.2"/>
<text x="726.3" y="396.3" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">Phase 1  pass / fail</text>
<rect x="660" y="414.3" width="132.6" height="20" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1.2"/>
<text x="726.3" y="428.3" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">Phase 2  pass / fail</text>
<path d="M272,226.3 L309,226.3" fill="none" stroke="#6250d6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M316,226.3 L309,222.5 L309,230.2Z" fill="#6250d6"/>
