<text x="619" y="404.3" font-size="11" fill="#52514e" font-weight="600" text-anchor="middle">effects</text>
<rect x="32" y="478.3" width="816" height="82" rx="12" fill="#f3f2ef"/>
<text x="52" y="505.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">MODELS</text>
<rect x="120" y="491.3" width="33.5" height="20" rx="10" fill="#1baf7a"/>
<text x="136.7" y="505.3" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">GLM</text>
<rect x="161.5" y="491.3" width="62.6" height="20" rx="10" fill="#2a78d6"/>
<text x="192.8" y="505.3" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">DeepSeek</text>
<rect x="232.1" y="491.3" width="33.5" height="20" rx="10" fill="#eb6834"/>
<text x="248.9" y="505.3" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Sol</text>
<text x="279.6" y="505.3" font-size="12.5" fill="#52514e">through AxonHub, packaged for Harbor, every trace kept as ATIF</text>
<text x="52" y="537.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">RULES</text>
<text x="120" y="537.3" font-size="12.5" fill="#52514e">freeze, commit, run once, review; a frozen result is never relabeled</text>
</svg>
