<path d="M316,256.3 L279,256.3" fill="none" stroke="#6250d6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M272,256.3 L279,260.2 L279,252.5Z" fill="#6250d6"/>
<text x="294" y="250.3" font-size="11" fill="#6250d6" font-weight="600" text-anchor="middle">read</text>
<path d="M272,410.3 L309,410.3" fill="none" stroke="#52514e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M316,410.3 L309,406.5 L309,414.2Z" fill="#52514e"/>
<text x="294" y="404.3" font-size="11" fill="#52514e" font-weight="600" text-anchor="middle">act</text>
