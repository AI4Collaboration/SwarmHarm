<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 495" width="880" height="495" role="img" aria-label="Timeline of SwarmHarm from 21 to 26 October with commits per day (43, 43, 77, 71, 141, 35) and what each day built and found">
<title>Timeline of SwarmHarm from 21 to 26 October with commits per day (43, 43, 77, 71, 141, 35) and what each day built and found</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style>
<rect x="0.5" y="0.5" width="879" height="494" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="32" y="48" font-size="20" fill="#0b0b0b" font-weight="650">How the project changed, 21 to 26 October</text>
<text x="32" y="74" font-size="13.5" fill="#52514e">From single agents in separate worlds to one population that has to find each other, then act together. Bars are</text>
<text x="32" y="93.2" font-size="13.5" fill="#52514e">commits per day.</text>
<rect x="35" y="130.3" width="266" height="30" rx="8" fill="#f3f2ef"/>
<text x="48" y="149.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">SEPARATE SMALL WORLDS</text>
<rect x="307" y="130.3" width="266" height="30" rx="8" fill="#f3f2ef"/>
<text x="320" y="149.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">SWARM FORMATION</text>
<rect x="579" y="130.3" width="266" height="30" rx="8" fill="#f3f2ef"/>
<text x="592" y="149.3" font-size="11.5" fill="#52514e" font-weight="650" letter-spacing="0.07em">ONE CONTINUOUS CAMPAIGN</text>
<path d="M36,312.3 L838,312.3" fill="none" stroke="#e4e3df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M846,312.3 L838,307.9 L838,316.7Z" fill="#e4e3df"/>
<rect x="82" y="263.9" width="36" height="34.4" rx="4" fill="#a3a29c"/>
<text x="100" y="255.9" font-size="12" fill="#52514e" font-weight="650" text-anchor="middle">43</text>
<circle cx="100" cy="312.3" r="5" fill="#ffffff" stroke="#52514e" stroke-width="1.6"/>
<text x="100" y="338.3" font-size="14" fill="#0b0b0b" font-weight="650" text-anchor="middle">21 Oct</text>
<text x="40" y="364.3" font-size="12.5" fill="#0b0b0b" font-weight="650">Single-agent gates</text>
<text x="40" y="384.1" font-size="11.5" fill="#52514e">no harmful</text>
<text x="40" y="399.7" font-size="11.5" fill="#52514e">authorization</text>
<rect x="218" y="263.9" width="36" height="34.4" rx="4" fill="#a3a29c"/>
<text x="236" y="255.9" font-size="12" fill="#52514e" font-weight="650" text-anchor="middle">43</text>
<circle cx="236" cy="312.3" r="5" fill="#ffffff" stroke="#52514e" stroke-width="1.6"/>
<text x="236" y="338.3" font-size="14" fill="#0b0b0b" font-weight="650" text-anchor="middle">22 Oct</text>
<text x="176" y="364.3" font-size="12.5" fill="#0b0b0b" font-weight="650">Procurement series</text>
<text x="176" y="384.1" font-size="11.5" fill="#52514e">one overrun, from a</text>
<text x="176" y="399.7" font-size="11.5" fill="#52514e">successor reading</text>
<text x="176" y="415.4" font-size="11.5" fill="#52514e">an old note</text>
<rect x="354" y="236.7" width="36" height="61.6" rx="4" fill="#a3a29c"/>
<text x="372" y="228.7" font-size="12" fill="#52514e" font-weight="650" text-anchor="middle">77</text>
<circle cx="372" cy="312.3" r="5" fill="#ffffff" stroke="#52514e" stroke-width="1.6"/>
<text x="372" y="338.3" font-size="14" fill="#0b0b0b" font-weight="650" text-anchor="middle">23 Oct</text>
<text x="312" y="364.3" font-size="12.5" fill="#0b0b0b" font-weight="650">Formation v1-v19</text>
<text x="312" y="384.1" font-size="11.5" fill="#52514e">passes only with</text>
<text x="312" y="399.7" font-size="11.5" fill="#52514e">staged arrival; 162</text>
<text x="312" y="415.4" font-size="11.5" fill="#52514e">reads, 0 asks in</text>
<text x="312" y="431" font-size="11.5" fill="#52514e">v14</text>
<rect x="490" y="241.5" width="36" height="56.8" rx="4" fill="#a3a29c"/>
<text x="508" y="233.5" font-size="12" fill="#52514e" font-weight="650" text-anchor="middle">71</text>
<circle cx="508" cy="312.3" r="5" fill="#ffffff" stroke="#52514e" stroke-width="1.6"/>
<text x="508" y="338.3" font-size="14" fill="#0b0b0b" font-weight="650" text-anchor="middle">24 Oct</text>
<text x="448" y="364.3" font-size="12.5" fill="#0b0b0b" font-weight="650">v20 variants, v41</text>
<text x="448" y="384.1" font-size="11.5" fill="#52514e">a route-matched</text>
<text x="448" y="399.7" font-size="11.5" fill="#52514e">triage view gets</text>
<text x="448" y="415.4" font-size="11.5" fill="#52514e">GLM through Phase 1</text>
<rect x="626" y="185.5" width="36" height="112.8" rx="4" fill="#0b0b0b"/>
<text x="644" y="177.5" font-size="12" fill="#52514e" font-weight="650" text-anchor="middle">141</text>
<circle cx="644" cy="312.3" r="5" fill="#ffffff" stroke="#52514e" stroke-width="1.6"/>
<text x="644" y="338.3" font-size="14" fill="#0b0b0b" font-weight="650" text-anchor="middle">25 Oct</text>
<text x="584" y="364.3" font-size="12.5" fill="#0b0b0b" font-weight="650">Cue ladder,</text>
<text x="584" y="382.1" font-size="12.5" fill="#0b0b0b" font-weight="650">campaign v3-v35</text>
<text x="584" y="401.8" font-size="11.5" fill="#52514e">both models pass</text>
<text x="584" y="417.5" font-size="11.5" fill="#52514e">Phase 1 at cue-7;</text>
<text x="584" y="433.1" font-size="11.5" fill="#52514e">first two-phase</text>
<text x="584" y="448.8" font-size="11.5" fill="#52514e">pass, v31</text>
<rect x="762" y="270.3" width="36" height="28" rx="4" fill="#a3a29c"/>
<text x="780" y="262.3" font-size="12" fill="#52514e" font-weight="650" text-anchor="middle">35</text>
<circle cx="780" cy="312.3" r="5" fill="#ffffff" stroke="#52514e" stroke-width="1.6"/>
<text x="780" y="338.3" font-size="14" fill="#0b0b0b" font-weight="650" text-anchor="middle">26 Oct</text>
<text x="720" y="364.3" font-size="12.5" fill="#0b0b0b" font-weight="650">Four domains, GLM</text>
<text x="720" y="382.1" font-size="12.5" fill="#0b0b0b" font-weight="650">and Sol</text>
<text x="720" y="401.8" font-size="11.5" fill="#52514e">8 of 8 matched</text>
<text x="720" y="417.5" font-size="11.5" fill="#52514e">campaigns pass both</text>
<text x="720" y="433.1" font-size="11.5" fill="#52514e">phases</text>
</svg>
