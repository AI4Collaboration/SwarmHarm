<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 441" width="880" height="441" role="img" aria-label="Flowchart of a verifier miss (agents act, frozen checker misses it, negative stands, fix in next version) with four examples: v20, v29, v24 and v15">
<title>Flowchart of a verifier miss (agents act, frozen checker misses it, negative stands, fix in next version) with four examples: v20, v29, v24 and v15</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style>
<rect x="0.5" y="0.5" width="879" height="440" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="32" y="48" font-size="20" fill="#0b0b0b" font-weight="650">Sometimes the checker decided the result, not the agents</text>
<text x="32" y="74" font-size="13.5" fill="#52514e">The project's rule is the right one: the frozen result stands and the fix goes into the next version. It does mean</text>
<text x="32" y="93.2" font-size="13.5" fill="#52514e">the version history mixes behavior changes with measurement changes.</text>
<rect x="32" y="134.3" width="188" height="84" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1.2"/>
<text x="44" y="157.3" font-size="13" fill="#0b0b0b" font-weight="650">Agents do it</text>
<text x="44" y="177.8" font-size="12" fill="#52514e">the trace shows the</text>
<text x="44" y="194.1" font-size="12" fill="#52514e">harmful action</text>
<rect x="241" y="134.3" width="188" height="84" rx="10" fill="#fdf3d9" stroke="#eda100" stroke-width="1.2"/>
<text x="253" y="157.3" font-size="13" fill="#0b0b0b" font-weight="650">Checker misses it</text>
<text x="253" y="177.8" font-size="12" fill="#52514e">a frozen word list, a</text>
<text x="253" y="194.1" font-size="12" fill="#52514e">missed cat read, a</text>
<text x="253" y="210.4" font-size="12" fill="#52514e">normalizer</text>
<path d="M223,176.3 L231,176.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M238,176.3 L231,172.5 L231,180.2Z" fill="#8a8984"/>
<rect x="450" y="134.3" width="188" height="84" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1.2"/>
<text x="462" y="157.3" font-size="13" fill="#0b0b0b" font-weight="650">Negative stands</text>
<text x="462" y="177.8" font-size="12" fill="#52514e">nothing is relabeled</text>
<path d="M432,176.3 L440,176.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M447,176.3 L440,172.5 L440,180.2Z" fill="#8a8984"/>
<rect x="659" y="134.3" width="188" height="84" rx="10" fill="#ffffff" stroke="#e4e3df" stroke-width="1.2"/>
<text x="671" y="157.3" font-size="13" fill="#0b0b0b" font-weight="650">Fix lands next version</text>
<text x="671" y="177.8" font-size="12" fill="#52514e">so the next run is</text>
<text x="671" y="194.1" font-size="12" fill="#52514e">measured differently</text>
<path d="M641,176.3 L649,176.3" fill="none" stroke="#8a8984" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M656,176.3 L649,172.5 L649,180.2Z" fill="#8a8984"/>
<rect x="32" y="254.3" width="816" height="34" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<text x="48" y="276.3" font-size="12.5" fill="#0b0b0b" font-weight="650" class="m">v20</text>
<text x="100" y="276.3" font-size="12.5" fill="#0b0b0b">verb list lacked "confirmed under"</text>
<text x="832" y="276.3" font-size="12.5" fill="#e34948" font-weight="600" text-anchor="end">missed: $18.31M of confirmations</text>
<rect x="32" y="296.3" width="816" height="34" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<text x="48" y="318.3" font-size="12.5" fill="#0b0b0b" font-weight="650" class="m">v29</text>
<text x="100" y="318.3" font-size="12.5" fill="#0b0b0b">parser missed "reserved under"</text>
<text x="832" y="318.3" font-size="12.5" fill="#e34948" font-weight="600" text-anchor="end">missed: 11 of 4 units</text>
<rect x="32" y="338.3" width="816" height="34" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<text x="48" y="360.3" font-size="12.5" fill="#0b0b0b" font-weight="650" class="m">v24</text>
<text x="100" y="360.3" font-size="12.5" fill="#0b0b0b">reviewer wanted the method after the effect</text>
<text x="832" y="360.3" font-size="12.5" fill="#e34948" font-weight="600" text-anchor="end">missed: 4 wrong-project orders</text>
<rect x="32" y="380.3" width="816" height="34" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<text x="48" y="402.3" font-size="12.5" fill="#0b0b0b" font-weight="650" class="m">v15</text>
<text x="100" y="402.3" font-size="12.5" fill="#0b0b0b">keyword check missed a typed locator transfer</text>
<text x="832" y="402.3" font-size="12.5" fill="#e34948" font-weight="600" text-anchor="end">missed: a DeepSeek positive</text>
</svg>
